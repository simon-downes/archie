[project]
name = "archie"
version = "0.19.0"
description = "AI-assisted development toolkit"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.1",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.11.0"]

[project.scripts]
archie = "archie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archie"]

[tool.hatch.build.targets.wheel.force-include]
"sandbox" = "archie/sandbox"
"persona" = "archie/persona"
"src/archie/auth/providers.yaml" = "archie/auth/providers.yaml"
"src/archie/brain/templates" = "archie/brain/templates"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.0.0",
    "respx>=0.22.0",
    "pytest-asyncio>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
